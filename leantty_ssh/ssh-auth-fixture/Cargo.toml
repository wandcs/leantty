[package]
name = "leantty-ssh-auth-fixture"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
rand = { version = "0.10", features = ["sys_rng"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=2.4.0"
tokio = { version = "1", features = ["io-util", "net", "process", "rt-multi-thread", "macros", "sync", "time"] }
zeroize = "1"
