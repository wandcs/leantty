[package]
name        = "leantty_ssh"
version     = "1.2.0"
edition     = "2021"
license     = "Apache-2.0"
description = "SSH client native library for LeanTTY terminal emulator"
repository  = "https://github.com/wandcs/leantty"
authors     = ["LeanTTY Contributors"]

[workspace]
members = ["leantty-ssh-core", "ssh-auth-fixture"]
default-members = ["."]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-ohos = { version = "1.0", default-features = false, features = [
    "napi8",
    "async",
    "tokio_rt",
] }
napi-derive-ohos = { version = "1.0" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "fs"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=2.4.0"
rand = { version = "0.10", features = ["sys_rng"] }
once_cell = "1"
zeroize = "1"
leantty-ssh-core = { path = "leantty-ssh-core" }

[build-dependencies]
napi-build-ohos = { version = "1.0" }

[dev-dependencies]
napi-ohos = { version = "1.0", default-features = false, features = ["dyn-symbols"] }

[profile.release]
lto = true
