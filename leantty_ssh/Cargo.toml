[package]
name        = "leantty_ssh"
version     = "1.7.0"
edition     = "2021"
license     = "Apache-2.0"
description = "SSH client native library for LeanTTY terminal emulator"
repository  = "https://github.com/wandcs/leantty"
authors     = ["LeanTTY Contributors"]

[workspace]
members = ["leantty-ssh-core", "ssh-auth-fixture"]
default-members = ["."]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-ohos = { version = "1.0", default-features = false, features = [
    "napi8",
    "async",
    "tokio_rt",
] }
napi-derive-ohos = { version = "1.0" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "fs"] }
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.0"
rand = { version = "0.10", features = ["sys_rng"] }
once_cell = "1"
zeroize = "1"
leantty-ssh-core = { path = "leantty-ssh-core" }
mosh-client = { git = "https://github.com/wandcs/mosh-client-rs.git", tag = "v0.1.4", version = "=0.1.4" }

[build-dependencies]
napi-build-ohos = { version = "1.0" }

[dev-dependencies]
napi-ohos = { version = "1.0", default-features = false, features = ["dyn-symbols"] }

[profile.release]
lto = true

# Temporary single-crate correction; upgrade/removal: ../third-party/ssh-key/README.md
[patch.crates-io]
ssh-key = { path = "../third-party/ssh-key/ssh-key-0.7.0-rc.11" }
