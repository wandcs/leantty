<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
  <link rel="stylesheet" href="xterm.css">
  <style>
    :root {
      --terminal-background: rgba(30, 30, 46, 0);
      --terminal-foreground: #CDD6F4;
      --terminal-overlay-background: #1E1E2E;
      --search-border: #585B70;
      --search-control: #45475A;
      --search-accent: #89B4FA;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #terminal-container { width: 100%; height: 100%; position: relative; }
    html, body,
    #terminal-container,
    #terminal-container > .xterm,
    .xterm .xterm-viewport {
      background-color: transparent;
    }
    #terminal-container > .xterm {
      width: 100%;
      height: 100%;
      padding: 8px 0px 8px 8px;
    }
    .xterm.secure-input .xterm-helper-textarea {
      -webkit-text-security: disc;
    }
    .xterm .xterm-scrollable-element > .scrollbar {
      background: transparent !important;
    }
    .xterm .xterm-scrollable-element > .scrollbar.vertical > .slider {
      border: 3px solid transparent;
      border-radius: 4px;
      background-clip: content-box !important;
    }
    #terminal-container:not(.link-modifier-active) > .xterm.xterm-cursor-pointer {
      cursor: text;
    }
    #terminal-container:not(.link-modifier-active) > .xterm.enable-mouse-events.xterm-cursor-pointer {
      cursor: default;
    }
    #link-preview {
      display: none;
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 20;
      max-width: calc(100% - 24px);
      padding: 4px 8px;
      overflow: hidden;
      color: var(--terminal-foreground);
      background: var(--terminal-overlay-background);
      border: 1px solid var(--search-border);
      border-radius: 4px;
      font: 12px 'HarmonyOS Sans', sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
    #search-panel {
      position: absolute;
      top: 8px;
      right: 54px;
      z-index: 30;
      display: flex;
      align-items: center;
      width: 344px;
      max-width: calc(100% - 56px);
      height: 34px;
      padding: 4px;
      gap: 2px;
      color: var(--terminal-foreground);
      background: var(--terminal-overlay-background);
      border: 1px solid var(--search-border);
      border-radius: 5px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      font: 12px 'HarmonyOS Sans', sans-serif;
    }
    #search-panel[hidden] { display: none; }
    #search-input {
      min-width: 0;
      height: 24px;
      flex: 1 1 208px;
      padding: 1px 7px;
      color: var(--terminal-foreground);
      caret-color: var(--search-accent);
      background: var(--search-control);
      border: 1px solid transparent;
      border-radius: 3px;
      outline: none;
      font: 12px 'JetBrains Mono Nerd Font Mono', 'HarmonyOS Sans Mono', monospace;
    }
    #search-input:focus { border-color: var(--search-accent); }
    #search-result {
      flex: 0 0 auto;
      min-width: 48px;
      width: 48px;
      max-width: 48px;
      overflow: hidden;
      color: var(--terminal-foreground);
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #search-panel button {
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      padding: 0;
      color: var(--terminal-foreground);
      background: transparent;
      border: 0;
      outline: none;
      font: 16px/24px 'HarmonyOS Sans', sans-serif;
    }
    #search-navigation {
      display: flex;
      flex: 0 0 54px;
      width: 54px;
      height: 26px;
      overflow: visible;
      border: 1px solid var(--search-border);
      border-radius: 3px;
    }
    #search-navigation button { border-radius: 0; }
    #search-previous { border-radius: 2px 0 0 2px; }
    #search-next {
      border-left: 1px solid var(--search-border);
      border-radius: 0 2px 2px 0;
    }
    #search-close {
      margin-left: 2px;
      border: 1px solid var(--search-border);
      border-radius: 3px;
    }
    #search-panel button:hover:not(:disabled) {
      background: var(--search-control);
    }
    #search-panel button:focus-visible {
      background: var(--search-control);
      box-shadow: inset 0 0 0 1px var(--search-accent);
    }
    #search-panel button:disabled { color: var(--search-border); }
    #search-panel button[data-tip] { position: relative; }
    #search-panel button[data-tip]::before,
    #search-panel button[data-tip]::after {
      position: absolute;
      left: 50%;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -2px);
      transition: opacity 90ms ease-out, transform 90ms ease-out;
    }
    #search-panel button[data-tip]::before {
      content: '';
      top: calc(100% + 4px);
      border: 4px solid transparent;
      border-bottom-color: var(--search-border);
    }
    #search-panel button[data-tip]::after {
      content: attr(data-tip);
      top: calc(100% + 11px);
      padding: 3px 7px;
      color: var(--terminal-foreground);
      background: var(--terminal-overlay-background);
      border: 1px solid var(--search-border);
      border-radius: 4px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.30);
      font: 11px/16px 'HarmonyOS Sans', sans-serif;
      white-space: nowrap;
    }
    #search-panel button[data-tip]:hover::before,
    #search-panel button[data-tip]:hover::after {
      opacity: 1;
      transform: translate(-50%, 0);
      transition-delay: 300ms;
    }
    #search-panel button[data-tip]:focus-visible::before,
    #search-panel button[data-tip]:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    @media (max-width: 320px) {
      #search-panel {
        top: 44px;
        right: 10px;
        max-width: calc(100% - 20px);
      }
    }
    @font-face {
      font-family: 'JetBrains Mono Nerd Font Mono';
      src: url('JetBrainsMonoNerdFontMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'JetBrains Mono Nerd Font Mono';
      src: url('JetBrainsMonoNerdFontMono-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
  </style>
</head>
<body>
  <div id="terminal-container">
    <div id="link-preview" class="xterm-hover"></div>
    <div id="search-panel" role="search" aria-label="Find in terminal" hidden>
      <input id="search-input" type="text" aria-label="Search text"
        placeholder="Find" autocomplete="off" autocapitalize="off" spellcheck="false">
      <span id="search-result" aria-live="polite"></span>
      <div id="search-navigation" role="group" aria-label="Search result navigation">
        <button id="search-previous" type="button" aria-label="Previous match, Shift+Enter"
          data-tip="Shift+Enter">↑</button>
        <button id="search-next" type="button" aria-label="Next match, Enter"
          data-tip="Enter">↓</button>
      </div>
      <button id="search-close" type="button" aria-label="Close search, Escape"
        data-tip="Esc">×</button>
    </div>
  </div>

  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="addon-search.js"></script>
  <script src="addon-web-links.js"></script>
  <script src="addon-serialize.js"></script>
  <script src="addon-webgl.js"></script>
  <script src="terminal-policy.js"></script>
  <script>
    var TERMINAL_SCROLLBACK_LINES = 10000;
    var TERMINAL_SCROLLBAR_WIDTH = 8;
    var TERMINAL_BASE_PADDING_TOP = 8;
    var TERMINAL_BASE_PADDING_BOTTOM = 8;
    var TERMINAL_BASE_PADDING_LEFT = 8;
    var TERMINAL_BASE_PADDING_RIGHT = 0;
    var MAX_SNAPSHOT_PAYLOAD_LENGTH = 4 * 1024 * 1024;
    var MAX_LOCALIZATION_PAYLOAD_LENGTH = 8192;
    var nativePort = null;
    var term = null;
    var fitAddon = null;
    var searchAddon = null;
    var webglAddon = null;
    var webLinksAddon = null;
    var serializeAddon = null;
    var restoringSnapshot = false;
    var pendingSnapshotRequestIds = [];
    var snapshotCapturePending = false;
    var initialized = false;
    var interactiveReadyReported = false;
    var secureInput = false;
    var secureInputClearTimer = 0;
    var requestedRenderer = 'webgl';
    var actualRenderer = 'dom';
    var rendererFallbackReason = 'not-initialized';
    var rendererContextLossCount = 0;
    var resizeFrameScheduled = false;
    var resizeForcePending = false;
    var lastReportedCols = 0;
    var lastReportedRows = 0;
    var perfActive = false;
    var perfCaseId = '';
    var perfExpectedBytes = 0;
    var perfReceivedBytes = 0;
    var perfStartedAt = 0;
    var perfParsedAt = 0;
    var perfAwaitingPaint = false;
    var perfPaintFrameScheduled = false;
    var bellAttentionGate = LeanTTYTerminalPolicy.createBellAttentionGate();
    var acceleratedWheelDispatch = false;
    var alternateWheelState = LeanTTYTerminalPolicy.createWheelState();
    var alternateWheelFrameScheduled = false;
    var lastAlternateWheelEvent = null;
    var hoveredLinkUrl = '';
    var linkModifierState = {
      ctrlKey: false,
      altKey: false,
      shiftKey: false,
      metaKey: false
    };
    var pendingLinkClick = null;
    var searchComposing = false;
    var searchQuery = '';
    var searchResultIndex = -1;
    var searchResultCount = 0;
    var searchOwnsSelection = false;
    var SEARCH_HIGHLIGHT_LIMIT = 1000;
    var LINK_DRAG_TOLERANCE_PIXELS = 4;
    var BRIDGE_VERSION = 'H2';
    var BRIDGE_NATIVE_TO_WEB = 'N2W';
    var BRIDGE_WEB_TO_NATIVE = 'W2N';
    var BRIDGE_DATA = 'DATA';
    var BRIDGE_CONTROL = 'CONTROL';

    function serializeBridgeMessage(direction, channel, kind, payload) {
      return BRIDGE_VERSION + '|' + direction + '|' + channel + '|' + kind + '|' + (payload || '');
    }

    function sendBridgeData(kind, payload) {
      if (nativePort) {
        nativePort.postMessage(serializeBridgeMessage(BRIDGE_WEB_TO_NATIVE, BRIDGE_DATA, kind, payload));
      }
    }

    function sendBridgeControl(kind, payload) {
      if (nativePort) {
        nativePort.postMessage(serializeBridgeMessage(BRIDGE_WEB_TO_NATIVE, BRIDGE_CONTROL, kind, payload));
      }
    }

    function acknowledgeBellAttention() {
      if (bellAttentionGate.acknowledge()) {
        sendBridgeControl('attentionAcknowledged', '');
      }
    }

    function triggerTerminalAttention() {
      if (bellAttentionGate.trigger()) {
        sendBridgeControl('bellAttention', '');
      }
    }

    function currentMouseTrackingMode() {
      return term ? term.modes.mouseTrackingMode : 'none';
    }

    function currentLinkDecorations() {
      try {
        var linkifier = term && term._core && term._core.linkifier;
        var currentLink = linkifier && linkifier.currentLink;
        return currentLink && currentLink.link ? currentLink.link.decorations : null;
      } catch (ex) {
        return null;
      }
    }

    function updateLinkPreview(active) {
      var preview = document.getElementById('link-preview');
      if (!preview) return;
      if (!active || hoveredLinkUrl.length === 0) {
        preview.style.display = 'none';
        preview.textContent = '';
        return;
      }
      preview.textContent = hoveredLinkUrl;
      preview.style.display = 'block';
    }

    function setCurrentLinkDecorations(linkModifierActive) {
      var decorations = currentLinkDecorations();
      if (decorations) {
        decorations.underline = linkModifierActive;
        decorations.pointerCursor = linkModifierActive;
      }
      var container = document.getElementById('terminal-container');
      if (container) {
        container.classList.toggle('link-modifier-active',
          linkModifierActive && hoveredLinkUrl.length > 0);
      }
      updateLinkPreview(linkModifierActive);
    }

    function refreshLinkVisualState() {
      var linkModifierActive = LeanTTYTerminalPolicy.isLinkModifierActive({
        ctrlKey: linkModifierState.ctrlKey,
        altKey: linkModifierState.altKey,
        shiftKey: linkModifierState.shiftKey,
        metaKey: linkModifierState.metaKey
      }, currentMouseTrackingMode());
      setCurrentLinkDecorations(linkModifierActive);
    }

    function updateLinkModifierState(event) {
      linkModifierState.ctrlKey = event.ctrlKey === true;
      linkModifierState.altKey = event.altKey === true;
      linkModifierState.shiftKey = event.shiftKey === true;
      linkModifierState.metaKey = event.metaKey === true;
    }

    function handleLinkKeyEvent(event) {
      updateLinkModifierState(event);
      refreshLinkVisualState();
    }

    function handleLinkHover(event, url) {
      hoveredLinkUrl = url;
      updateLinkModifierState(event);
      Promise.resolve().then(refreshLinkVisualState);
    }

    function handleLinkLeave() {
      hoveredLinkUrl = '';
      pendingLinkClick = null;
      setCurrentLinkDecorations(false);
    }

    function beginLinkClick(event) {
      pendingLinkClick = null;
      if (hoveredLinkUrl.length === 0 ||
          !LeanTTYTerminalPolicy.isLinkModifierActive(event, currentMouseTrackingMode()) ||
          event.button !== 0) {
        return;
      }
      pendingLinkClick = {
        url: hoveredLinkUrl,
        clientX: event.clientX,
        clientY: event.clientY,
        dragged: false
      };
    }

    function trackLinkDrag(event) {
      if (!pendingLinkClick || pendingLinkClick.dragged) return;
      var deltaX = event.clientX - pendingLinkClick.clientX;
      var deltaY = event.clientY - pendingLinkClick.clientY;
      pendingLinkClick.dragged =
        deltaX * deltaX + deltaY * deltaY >
        LINK_DRAG_TOLERANCE_PIXELS * LINK_DRAG_TOLERANCE_PIXELS;
    }

    function activateTerminalLink(event, url) {
      var sameLink = pendingLinkClick !== null && pendingLinkClick.url === url;
      var dragged = pendingLinkClick !== null && pendingLinkClick.dragged;
      if (LeanTTYTerminalPolicy.shouldActivateLink(
        event, currentMouseTrackingMode(), sameLink, dragged)) {
        event.preventDefault();
        sendBridgeControl('openUrl', url);
      }
      pendingLinkClick = null;
    }

    function parseBridgeMessage(raw) {
      if (typeof raw !== 'string' || raw.length === 0) return null;
      var versionEnd = raw.indexOf('|');
      var directionEnd = raw.indexOf('|', versionEnd + 1);
      var channelEnd = raw.indexOf('|', directionEnd + 1);
      var kindEnd = raw.indexOf('|', channelEnd + 1);
      if (versionEnd < 0 || directionEnd < 0 || channelEnd < 0 || kindEnd < 0) return null;
      if (raw.substring(0, versionEnd) !== BRIDGE_VERSION) return null;
      var direction = raw.substring(versionEnd + 1, directionEnd);
      var channel = raw.substring(directionEnd + 1, channelEnd);
      var kind = raw.substring(channelEnd + 1, kindEnd);
      var payload = raw.substring(kindEnd + 1);
      if (direction !== BRIDGE_NATIVE_TO_WEB ||
          (channel !== BRIDGE_DATA && channel !== BRIDGE_CONTROL) || kind.length === 0 ||
          !isSupportedNativeMessage(channel, kind, payload)) return null;
      return { channel: channel, kind: kind, payload: payload };
    }

    function parseTerminalPacket(raw) {
      if (!(raw instanceof ArrayBuffer) || raw.byteLength < 12) return null;
      var packet = new Uint8Array(raw);
      if (packet[0] !== 0x48 || packet[1] !== 0x54 || packet[2] !== 0x42 || packet[3] !== 0x31) {
        return null;
      }
      var header = new DataView(raw);
      var sequence = header.getUint32(4, true);
      var payloadLength = header.getUint32(8, true);
      if (sequence === 0 || payloadLength === 0 || payloadLength !== raw.byteLength - 12) return null;
      return {
        sequence: sequence,
        bytes: new Uint8Array(raw, 12, payloadLength)
      };
    }

    function isSupportedNativeMessage(channel, kind, payload) {
      if (channel === BRIDGE_DATA) {
        return kind === 'terminal';
      }
      return kind === 'theme' ||
        (kind === 'localization' && payload.length > 0 &&
          payload.length <= MAX_LOCALIZATION_PAYLOAD_LENGTH) || kind === 'focus' || kind === 'blur' ||
        kind === 'clearSelection' || kind === 'ping' ||
        kind === 'fit' || kind === 'fontSize' || kind === 'copySelection' ||
        kind === 'secondaryAction' || (kind === 'copyOrInterrupt' && payload.length === 0) ||
        kind === 'snapshotRequest' || kind === 'restoreSnapshot' ||
        (kind === 'sessionOutputAnchor' && payload.length === 0) ||
        (kind === 'sessionResetViewport' && payload.length === 0) ||
        (kind === 'inputSecurity' && (payload === 'plain' || payload === 'masked')) ||
        ((kind === 'searchOpen' || kind === 'searchClose') && payload.length === 0);
    }

    function searchElement(id) {
      return document.getElementById(id);
    }

    function applyLocalization(text) {
      var required = ['language', 'findInTerminal', 'findText', 'placeholder', 'results',
        'previousMatch', 'nextMatch', 'close', 'typeToFind', 'noResults'];
      if (!text || typeof text !== 'object') return;
      for (var i = 0; i < required.length; i++) {
        var value = text[required[i]];
        if (typeof value !== 'string' || value.length === 0 || value.length > 200) return;
      }
      if (text.language !== 'en' && text.language !== 'zh-CN') return;
      document.documentElement.lang = text.language;
      var panel = searchElement('search-panel');
      var input = searchElement('search-input');
      var navigation = searchElement('search-navigation');
      var previous = searchElement('search-previous');
      var next = searchElement('search-next');
      var close = searchElement('search-close');
      if (panel) panel.setAttribute('aria-label', text.findInTerminal);
      if (input) {
        input.setAttribute('aria-label', text.findText);
        input.setAttribute('placeholder', text.placeholder);
      }
      if (navigation) navigation.setAttribute('aria-label', text.results);
      if (previous) previous.setAttribute('aria-label', text.previousMatch);
      if (next) next.setAttribute('aria-label', text.nextMatch);
      if (close) close.setAttribute('aria-label', text.close);
      searchText = text;
      updateSearchFeedback();
    }

    function isSearchOpen() {
      var panel = searchElement('search-panel');
      return !!panel && !panel.hidden;
    }

    function searchOptions() {
      var style = getComputedStyle(document.documentElement);
      return {
        regex: false,
        wholeWord: false,
        caseSensitive: false,
        decorations: {
          matchBackground: style.getPropertyValue('--search-control').trim() || '#45475A',
          matchBorder: style.getPropertyValue('--search-border').trim() || '#585B70',
          matchOverviewRuler: style.getPropertyValue('--search-accent').trim() || '#89B4FA',
          activeMatchBackground: style.getPropertyValue('--search-border').trim() || '#585B70',
          activeMatchBorder: style.getPropertyValue('--search-accent').trim() || '#89B4FA',
          activeMatchColorOverviewRuler: style.getPropertyValue('--search-accent').trim() || '#89B4FA'
        }
      };
    }

    var searchText = {
      typeToFind: 'Type to find',
      noResults: 'No results'
    };

    function updateSearchFeedback() {
      var result = searchElement('search-result');
      var previous = searchElement('search-previous');
      var next = searchElement('search-next');
      var label = LeanTTYTerminalPolicy.searchResultLabel(
        searchQuery, searchResultIndex, searchResultCount, SEARCH_HIGHLIGHT_LIMIT);
      if (result) {
        result.textContent = label;
        var resultDescription = searchQuery.length === 0 ? searchText.typeToFind :
          (searchResultCount <= 0 ? searchText.noResults : label);
        result.title = resultDescription;
        result.setAttribute('aria-label', resultDescription);
      }
      var navigationDisabled = searchQuery.length === 0 || searchResultCount <= 0;
      if (previous) previous.disabled = navigationDisabled;
      if (next) next.disabled = navigationDisabled;
    }

    function resetSearchResults() {
      searchResultIndex = -1;
      searchResultCount = 0;
      updateSearchFeedback();
    }

    function runSearch(backwards, queryChanged) {
      if (!searchAddon || !term) return;
      var input = searchElement('search-input');
      var nextQuery = input ? input.value : '';
      if (nextQuery.length === 0) {
        searchQuery = '';
        searchAddon.clearDecorations();
        if (searchOwnsSelection && term) term.clearSelection();
        searchOwnsSelection = false;
        resetSearchResults();
        return;
      }
      if (queryChanged || nextQuery !== searchQuery) {
        searchAddon.clearDecorations();
        term.clearSelection();
        searchOwnsSelection = true;
      }
      searchQuery = nextQuery;
      if (backwards) {
        searchAddon.findPrevious(searchQuery, searchOptions());
      } else {
        searchAddon.findNext(searchQuery, searchOptions());
      }
    }

    function openSearch() {
      var panel = searchElement('search-panel');
      var input = searchElement('search-input');
      if (!panel || !input || !searchAddon) return;
      if (panel.hidden) {
        panel.hidden = false;
        input.value = '';
        searchQuery = '';
        resetSearchResults();
      }
      input.focus();
      input.select();
      sendBridgeControl('searchState', 'open');
    }

    function closeSearch(restoreTerminalFocus) {
      var panel = searchElement('search-panel');
      var input = searchElement('search-input');
      if (!panel || panel.hidden) return;
      panel.hidden = true;
      searchComposing = false;
      searchQuery = '';
      searchResultIndex = -1;
      searchResultCount = 0;
      if (input) input.value = '';
      if (searchAddon) searchAddon.clearDecorations();
      if (searchOwnsSelection && term) term.clearSelection();
      searchOwnsSelection = false;
      updateSearchFeedback();
      sendBridgeControl('searchState', 'closed');
      if (restoreTerminalFocus && term) term.focus();
    }

    function handleSearchPanelKeydown(event) {
      if (!isSearchOpen() || searchComposing || event.isComposing) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        closeSearch(true);
        return;
      }
      if (event.key === 'Enter' && event.target === searchElement('search-input')) {
        event.preventDefault();
        event.stopPropagation();
        runSearch(event.shiftKey, false);
        return;
      }
      if (event.key !== 'Tab') return;
      var controls = [searchElement('search-input'), searchElement('search-previous'),
        searchElement('search-next'), searchElement('search-close')];
      var currentIndex = controls.indexOf(document.activeElement);
      var nextIndex = LeanTTYTerminalPolicy.wrappedControlIndex(
        currentIndex, controls.length, event.shiftKey);
      if (nextIndex >= 0 && controls[nextIndex]) {
        event.preventDefault();
        event.stopPropagation();
        controls[nextIndex].focus();
      }
    }

    function initializeSearchUi() {
      var panel = searchElement('search-panel');
      var input = searchElement('search-input');
      var previous = searchElement('search-previous');
      var next = searchElement('search-next');
      var close = searchElement('search-close');
      if (!panel || !input || !previous || !next || !close) return;
      input.addEventListener('compositionstart', function() {
        searchComposing = true;
        sendBridgeControl('searchState', 'composing');
      });
      input.addEventListener('compositionend', function() {
        searchComposing = false;
        sendBridgeControl('searchState', isSearchOpen() ? 'open' : 'closed');
        runSearch(false, true);
      });
      input.addEventListener('input', function() {
        if (!searchComposing) runSearch(false, true);
      });
      panel.addEventListener('keydown', handleSearchPanelKeydown);
      previous.addEventListener('click', function() { runSearch(true, false); });
      next.addEventListener('click', function() { runSearch(false, false); });
      close.addEventListener('click', function() { closeSearch(true); });
      updateSearchFeedback();
    }

    function serializeTerminalSnapshot(availableLength) {
      if (!serializeAddon) {
        return null;
      }
      var scrollback = 0;
      var bestSnapshot = null;
      try {
        while (true) {
          var snapshot = serializeAddon.serialize({ scrollback: scrollback });
          if (term && term._core && term._core.coreService &&
              term._core.coreService.isCursorHidden) {
            snapshot += '\x1b[?25l';
          }
          if (snapshot.length > availableLength) {
            return bestSnapshot;
          }
          bestSnapshot = snapshot;
          if (scrollback === TERMINAL_SCROLLBACK_LINES) {
            return bestSnapshot;
          }
          scrollback = scrollback === 0 ? Math.min(64, TERMINAL_SCROLLBACK_LINES) :
            Math.min(scrollback * 2, TERMINAL_SCROLLBACK_LINES);
        }
      } catch (ex) {
        return bestSnapshot;
      }
    }

    function requestTerminalSnapshot(requestId) {
      pendingSnapshotRequestIds.push(requestId);
      if (snapshotCapturePending || !term) {
        return;
      }
      snapshotCapturePending = true;
      try {
        term.write('', function() {
          var requestIds = pendingSnapshotRequestIds;
          pendingSnapshotRequestIds = [];
          var maxRequestIdLength = 0;
          for (var i = 0; i < requestIds.length; i++) {
            maxRequestIdLength = Math.max(maxRequestIdLength, requestIds[i].length);
          }
          var snapshot = serializeTerminalSnapshot(
            MAX_SNAPSHOT_PAYLOAD_LENGTH - maxRequestIdLength - 1);
          if (snapshot !== null) {
            for (var j = 0; j < requestIds.length; j++) {
              sendBridgeControl('snapshot', requestIds[j] + '|' + snapshot);
            }
          }
          snapshotCapturePending = false;
        });
      } catch (ex) {
        pendingSnapshotRequestIds = [];
        snapshotCapturePending = false;
      }
    }

    function positionSessionOutput(onComplete) {
      if (!term) {
        onComplete();
        return;
      }
      var anchorRow = LeanTTYTerminalPolicy.sessionOutputAnchorRow(term.buffer.active, term.rows);
      try {
        term.write('\x1b[' + anchorRow.toString() + ';1H', onComplete);
      } catch (ex) {
        onComplete();
      }
    }

    function reportRendererState() {
      if (!nativePort) return;
      sendBridgeControl('rendererState', JSON.stringify({
        requested: requestedRenderer,
        actual: actualRenderer,
        fallbackReason: rendererFallbackReason,
        contextLossCount: rendererContextLossCount
      }));
    }

    function fallbackToDomRenderer(reason) {
      if (reason === 'context-loss') {
        rendererContextLossCount++;
      }
      if (webglAddon) {
        try { webglAddon.dispose(); } catch (ex) {}
        webglAddon = null;
      }
      actualRenderer = 'dom';
      rendererFallbackReason = reason;
      if (term) {
        term.refresh(0, term.rows - 1);
      }
      reportRendererState();
    }

    function activateDefaultRenderer() {
      try {
        webglAddon = new WebglAddon.WebglAddon();
        webglAddon.onContextLoss(function() {
          fallbackToDomRenderer('context-loss');
        });
        term.loadAddon(webglAddon);
        actualRenderer = 'webgl';
        rendererFallbackReason = 'none';
      } catch (ex) {
        fallbackToDomRenderer('initialization-failed');
      }
    }

    function reportPerfResult() {
      if (!nativePort || !perfActive) return;
      var paintedAt = performance.now();
      var parseMs = perfParsedAt > 0 ? perfParsedAt - perfStartedAt : paintedAt - perfStartedAt;
      var paintMs = paintedAt - perfStartedAt;
      var expectedBytes = Math.max(1, perfExpectedBytes);
      var metric = {
        caseId: perfCaseId,
        expectedBytes: perfExpectedBytes,
        actualBytes: perfReceivedBytes,
        completenessPercent: Math.round(perfReceivedBytes / expectedBytes * 100000) / 1000,
        parseMs: Math.round(parseMs * 1000) / 1000,
        parseMbps: Math.round((perfReceivedBytes * 8 / 1000000) /
          (Math.max(parseMs, 0.001) / 1000) * 1000) / 1000,
        paintMs: Math.round(paintMs * 1000) / 1000,
        renderedMs: Math.round(paintMs * 1000) / 1000,
        renderMbps: Math.round((perfReceivedBytes * 8 / 1000000) /
          (Math.max(paintMs, 0.001) / 1000) * 1000) / 1000
      };
      sendBridgeControl('perfRender', JSON.stringify(metric));
      perfActive = false;
      perfAwaitingPaint = false;
      perfPaintFrameScheduled = false;
      perfCaseId = '';
      perfExpectedBytes = 0;
      perfReceivedBytes = 0;
      perfStartedAt = 0;
      perfParsedAt = 0;
    }

    function reportPerfAfterPaint() {
      if (!perfActive || !perfAwaitingPaint || perfPaintFrameScheduled) return;
      perfPaintFrameScheduled = true;
      requestAnimationFrame(function() {
        reportPerfResult();
      });
    }

    var defaultTheme = {
      background: 'rgba(30, 30, 46, 0)',
      foreground: '#CDD6F4',
      cursor: '#F5E0DC',
      cursorAccent: '#1E1E2E',
      selectionBackground: '#585B70',
      selectionForeground: '#CDD6F4',
      selectionInactiveBackground: '#45475A',
      black: '#45475A',
      red: '#F38BA8',
      green: '#A6E3A1',
      yellow: '#F9E2AF',
      blue: '#89B4FA',
      magenta: '#F5C2E7',
      cyan: '#94E2D5',
      white: '#BAC2DE',
      brightBlack: '#585B70',
      brightRed: '#F38BA8',
      brightGreen: '#A6E3A1',
      brightYellow: '#F9E2AF',
      brightBlue: '#89B4FA',
      brightMagenta: '#F5C2E7',
      brightCyan: '#94E2D5',
      brightWhite: '#A6ADC8'
    };

    function applyTerminalTheme(themeObj) {
      if (!themeObj || typeof themeObj.background !== 'string' || themeObj.background.length === 0) return;
      if (isSearchOpen()) closeSearch(true);
      themeObj.overviewRulerBorder = themeObj.background;
      document.documentElement.style.setProperty('--terminal-background', themeObj.background);
      document.documentElement.style.setProperty('--terminal-foreground', themeObj.foreground || '#CDD6F4');
      document.documentElement.style.setProperty('--terminal-overlay-background',
        themeObj.cursorAccent || '#1E1E2E');
      document.documentElement.style.setProperty('--search-border',
        themeObj.selectionBackground || '#585B70');
      document.documentElement.style.setProperty('--search-control',
        themeObj.selectionInactiveBackground || '#45475A');
      document.documentElement.style.setProperty('--search-accent', themeObj.blue || '#89B4FA');
      if (term) {
        term.options.theme = themeObj;
        term.refresh(0, term.rows - 1);
      }
    }

    function fitAndCenterTerminalGrid() {
      if (!fitAddon || !term) return;
      var terminalElement = term.element;
      if (!terminalElement || !terminalElement.parentElement) {
        fitAddon.fit();
        return;
      }

      terminalElement.style.paddingTop = TERMINAL_BASE_PADDING_TOP + 'px';
      terminalElement.style.paddingLeft = TERMINAL_BASE_PADDING_LEFT + 'px';
      fitAddon.fit();

      var screenElement = terminalElement.querySelector('.xterm-screen');
      if (!screenElement) return;
      var containerWidth = parseInt(
        window.getComputedStyle(terminalElement.parentElement).width,
        10
      );
      var containerHeight = parseInt(
        window.getComputedStyle(terminalElement.parentElement).height,
        10
      );
      var gridRect = screenElement.getBoundingClientRect();
      var gridWidth = gridRect.width;
      var gridHeight = gridRect.height;
      var centeredLeftPadding = LeanTTYTerminalPolicy.centerGridLeadingPadding(
        TERMINAL_BASE_PADDING_LEFT,
        TERMINAL_BASE_PADDING_RIGHT + TERMINAL_SCROLLBAR_WIDTH,
        containerWidth,
        gridWidth
      );
      var centeredTopPadding = LeanTTYTerminalPolicy.centerGridLeadingPadding(
        TERMINAL_BASE_PADDING_TOP,
        TERMINAL_BASE_PADDING_BOTTOM,
        containerHeight,
        gridHeight
      );
      terminalElement.style.paddingLeft = centeredLeftPadding + 'px';
      terminalElement.style.paddingTop = centeredTopPadding + 'px';
      fitAddon.fit();
    }

    function performResize() {
      resizeFrameScheduled = false;
      if (!fitAddon || !term) return;
      var force = resizeForcePending;
      resizeForcePending = false;
      fitAndCenterTerminalGrid();
      var cols = term.cols;
      var rows = term.rows;
      if (nativePort && (force || cols !== lastReportedCols || rows !== lastReportedRows)) {
        lastReportedCols = cols;
        lastReportedRows = rows;
        sendBridgeControl('resize', cols + ',' + rows);
      }
    }

    function reportResize(force) {
      resizeForcePending = resizeForcePending || force === true;
      if (resizeFrameScheduled) return;
      resizeFrameScheduled = true;
      requestAnimationFrame(performResize);
    }

    function pasteFromSystemClipboard() {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        sendBridgeControl('clipboardPaste', 'unavailable');
        return;
      }
      navigator.clipboard.readText().then(function(text) {
        if (text.length > 0 && term) {
          acknowledgeBellAttention();
          term.paste(text);
        }
        sendBridgeControl('clipboardPaste', 'ok,' + text.length);
      }).catch(function() {
        sendBridgeControl('clipboardPaste', 'failed');
      });
    }

    function scheduleAlternateWheelFrame() {
      if (alternateWheelFrameScheduled) return;
      alternateWheelFrameScheduled = true;
      requestAnimationFrame(pumpAlternateWheelFrame);
    }

    function emitAlternateWheelSteps(steps) {
      if (!term || steps === 0 || !lastAlternateWheelEvent) return;
      var count = Math.abs(steps);
      var direction = steps < 0 ? 'A' : 'B';
      if (term.modes.mouseTrackingMode === 'none') {
        var sequence = '\x1b' + (term.modes.applicationCursorKeysMode ? 'O' : '[') + direction;
        term.input(sequence.repeat(count), true);
        return;
      }
      if (!term.element) return;
      acceleratedWheelDispatch = true;
      try {
        for (var i = 0; i < count; i++) {
          term.element.dispatchEvent(new WheelEvent('wheel', {
            bubbles: true,
            cancelable: true,
            deltaY: steps < 0 ? -1 : 1,
            deltaMode: WheelEvent.DOM_DELTA_LINE,
            clientX: lastAlternateWheelEvent.clientX,
            clientY: lastAlternateWheelEvent.clientY,
            ctrlKey: lastAlternateWheelEvent.ctrlKey,
            altKey: lastAlternateWheelEvent.altKey,
            shiftKey: lastAlternateWheelEvent.shiftKey,
            metaKey: lastAlternateWheelEvent.metaKey
          }));
        }
      } finally {
        acceleratedWheelDispatch = false;
      }
    }

    function pumpAlternateWheelFrame() {
      alternateWheelFrameScheduled = false;
      if (!term || term.buffer.active.type !== 'alternate' || term.hasSelection()) {
        alternateWheelState = LeanTTYTerminalPolicy.createWheelState();
        return;
      }
      emitAlternateWheelSteps(LeanTTYTerminalPolicy.consumeWheelFrame(alternateWheelState, term.rows));
      if (LeanTTYTerminalPolicy.hasPendingWheelSteps(alternateWheelState)) {
        scheduleAlternateWheelFrame();
      }
    }

    function handleAlternateWheel(event) {
      if (acceleratedWheelDispatch || !term) return;
      if (term.buffer.active.type !== 'alternate' || term.hasSelection()) {
        alternateWheelState = LeanTTYTerminalPolicy.createWheelState();
        return;
      }
      var rowsElement = document.querySelector('.xterm-rows');
      var cellHeight = rowsElement && term.rows > 0 ? rowsElement.getBoundingClientRect().height / term.rows : 16;
      LeanTTYTerminalPolicy.enqueueWheel(alternateWheelState, event.deltaY, event.deltaMode,
        cellHeight, term.rows, event.timeStamp);
      lastAlternateWheelEvent = {
        clientX: event.clientX,
        clientY: event.clientY,
        ctrlKey: event.ctrlKey,
        altKey: event.altKey,
        shiftKey: event.shiftKey,
        metaKey: event.metaKey
      };
      event.preventDefault();
      event.stopPropagation();
      scheduleAlternateWheelFrame();
    }

    function initTerminal() {
      if (initialized) return;
      initialized = true;

      applyTerminalTheme(defaultTheme);
      term = new Terminal({
        allowProposedApi: true,
        allowTransparency: true,
        theme: defaultTheme,
        fontSize: 14,
        fontFamily: "'JetBrains Mono Nerd Font Mono', 'HarmonyOS Sans Mono', monospace",
        cursorBlink: true,
        cursorStyle: 'bar',
        scrollback: TERMINAL_SCROLLBACK_LINES,
        overviewRuler: { width: TERMINAL_SCROLLBAR_WIDTH },
        scrollSensitivity: 2,
        smoothScrollDuration: 0,
        linkHandler: {
          activate: activateTerminalLink,
          hover: handleLinkHover,
          leave: handleLinkLeave,
          allowNonHttpProtocols: true
        }
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      searchAddon = new SearchAddon.SearchAddon({ highlightLimit: SEARCH_HIGHLIGHT_LIMIT });
      term.loadAddon(searchAddon);
      searchAddon.onDidChangeResults(function(result) {
        searchResultIndex = result.resultIndex;
        searchResultCount = result.resultCount;
        updateSearchFeedback();
      });
      serializeAddon = new SerializeAddon.SerializeAddon();
      term.loadAddon(serializeAddon);
      var terminalContainer = document.getElementById('terminal-container');
      term.open(terminalContainer);
      webLinksAddon = new WebLinksAddon.WebLinksAddon(activateTerminalLink, {
        hover: handleLinkHover,
        leave: handleLinkLeave
      });
      term.loadAddon(webLinksAddon);
      terminalContainer.addEventListener('wheel', handleAlternateWheel, true);
      terminalContainer.addEventListener('mousedown', function(event) {
        var panel = searchElement('search-panel');
        if (panel && event.target && panel.contains(event.target)) return;
        if (isSearchOpen()) closeSearch(false);
      }, true);
      terminalContainer.addEventListener('mousedown', beginLinkClick, true);
      terminalContainer.addEventListener('mousemove', trackLinkDrag, true);
      terminalContainer.addEventListener('mouseup', function() {
        pendingLinkClick = null;
      });
      initializeSearchUi();
      term.buffer.onBufferChange(function() { closeSearch(true); });
      window.addEventListener('keydown', handleLinkKeyEvent, true);
      window.addEventListener('keyup', handleLinkKeyEvent, true);
      window.addEventListener('copy', handleTerminalCopy, true);
      window.addEventListener('blur', function() {
        closeSearch(false);
        linkModifierState.ctrlKey = false;
        linkModifierState.altKey = false;
        linkModifierState.shiftKey = false;
        linkModifierState.metaKey = false;
        pendingLinkClick = null;
        refreshLinkVisualState();
      });
      activateDefaultRenderer();
      fitAndCenterTerminalGrid();

      term.write('\x1b[?25h');

      term.onData(function(data) {
        if (!restoringSnapshot) {
          sendBridgeData('terminal', data);
        }
      });

      term.onKey(function() {
        acknowledgeBellAttention();
        scheduleSecureInputClear();
      });
      if (term.textarea) {
        term.textarea.setAttribute('autocomplete', 'off');
        term.textarea.addEventListener('compositionstart', function() {
          acknowledgeBellAttention();
        });
        term.textarea.addEventListener('input', function() {
          acknowledgeBellAttention();
          scheduleSecureInputClear();
        });
        term.textarea.addEventListener('paste', acknowledgeBellAttention);
      }
      applyInputSecurity();

      term.parser.registerOscHandler(52, function(payload) {
        var decoded = LeanTTYTerminalPolicy.decodeOsc52(payload);
        if (decoded.accepted) {
          sendBridgeControl('clipboardWrite', decoded.text);
        }
        return true;
      });

      term.parser.registerOscHandler(9, function(payload) {
        if (LeanTTYTerminalPolicy.validateAttentionOsc(9, payload).accepted) {
          triggerTerminalAttention();
        }
        return true;
      });

      term.parser.registerOscHandler(99, function(payload) {
        var capabilityResponse = LeanTTYTerminalPolicy.createOsc99CapabilityResponse(payload);
        if (capabilityResponse.length > 0) {
          term.input(capabilityResponse, false);
        } else if (LeanTTYTerminalPolicy.validateAttentionOsc(99, payload).accepted) {
          triggerTerminalAttention();
        }
        return true;
      });

      term.parser.registerOscHandler(777, function(payload) {
        if (LeanTTYTerminalPolicy.validateAttentionOsc(777, payload).accepted) {
          triggerTerminalAttention();
        }
        return true;
      });

      term.attachCustomKeyEventHandler(function(event) {
        if (event.type !== 'keydown' || (!event.ctrlKey && !event.metaKey) || event.altKey) {
          return true;
        }
        var key = typeof event.key === 'string' ? event.key.toLowerCase() : '';
        var code = typeof event.code === 'string' ? event.code : '';
        if (key === 'v' || code === 'KeyV') {
          return false;
        }
        if (key !== 'c' && code !== 'KeyC') {
          return true;
        }
        if (copyTerminalSelection()) {
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
        if (event.shiftKey) {
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
        return true;
      });

      terminalContainer.addEventListener('contextmenu', function(event) {
        event.preventDefault();
        event.stopPropagation();
      });

      term.onTitleChange(function(title) {
        if (title.indexOf('LTTY_PERF_BEGIN__:') === 0) {
          var beginParts = title.split(':');
          if (beginParts.length === 3) {
            perfActive = true;
            perfCaseId = beginParts[1];
            perfExpectedBytes = parseInt(beginParts[2], 10);
            perfReceivedBytes = 0;
            perfStartedAt = performance.now();
            perfParsedAt = 0;
            perfAwaitingPaint = false;
            perfPaintFrameScheduled = false;
          }
          return;
        }
        if (title === 'LTTY_PERF_END__:' + perfCaseId) {
          perfParsedAt = performance.now();
          perfAwaitingPaint = true;
          term.refresh(0, term.rows - 1);
          return;
        }
      });

      term.onBell(function() {
        triggerTerminalAttention();
      });

      term.onRender(function() {
        reportPerfAfterPaint();
        refreshLinkVisualState();
      });

      window.addEventListener('resize', function() {
        reportResize();
      });
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(function() {
          reportResize();
        }).observe(terminalContainer);
      }

      if (nativePort) {
        sendBridgeControl('ready', '');
        reportRendererState();
        setTimeout(function() { reportResize(true); }, 100);
      }

    }

    function reportInteractiveReadyAfterPaint() {
      if (interactiveReadyReported) return;
      interactiveReadyReported = true;
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          sendBridgeControl('interactiveReady', '');
        });
      });
    }

    function writeTerminalPacket(terminalPacket, onComplete) {
      if (!terminalPacket || !term) {
        onComplete();
        return;
      }
      var terminalBytes = terminalPacket.bytes;
      if (perfActive) {
        var perfText = new TextDecoder('utf-8').decode(terminalBytes);
        var endSequence = '\x1b]0;LTTY_PERF_END__:' + perfCaseId;
        var endOffset = perfText.indexOf(endSequence);
        var perfPayload = endOffset >= 0 ? perfText.substring(0, endOffset) : perfText;
        perfReceivedBytes += LeanTTYTerminalPolicy.countPerfPayloadBytes(perfPayload);
      }
      term.write(terminalBytes, function() {
        sendBridgeControl('writeAck',
          terminalPacket.sequence.toString() + ',' + terminalBytes.byteLength.toString());
        onComplete();
        reportInteractiveReadyAfterPaint();
      });
    }

    window.addEventListener('message', function(event) {
      if (event.data === 'initPort' && event.ports && event.ports.length > 0) {
        nativePort = event.ports[0];

        nativePort.onmessage = function(e) {
          var terminalPacket = parseTerminalPacket(e.data);
          if (terminalPacket) {
            writeTerminalPacket(terminalPacket, function() {});
            return;
          }
          var message = parseBridgeMessage(e.data);
          if (!message) return;

          switch(message.kind) {
            case 'theme':
              if (message.channel !== BRIDGE_CONTROL) break;
              if (term) {
                try {
                  var themeObj = JSON.parse(message.payload);
                  applyTerminalTheme(themeObj);
                } catch(ex) {}
              }
              break;
            case 'localization':
              if (message.channel !== BRIDGE_CONTROL) break;
              try {
                applyLocalization(JSON.parse(message.payload));
              } catch(ex) {}
              break;
            case 'focus':
              if (message.channel !== BRIDGE_CONTROL) break;
              bellAttentionGate.rearmDelivery();
              if (term && !isSearchOpen()) { term.focus(); }
              break;
            case 'blur':
              if (message.channel !== BRIDGE_CONTROL) break;
              closeSearch(false);
              bellAttentionGate.rearmDelivery();
              if (term) { term.blur(); }
              break;
            case 'clearSelection':
              if (message.channel !== BRIDGE_CONTROL) break;
              if (term) { term.clearSelection(); }
              break;
            case 'ping':
              if (message.channel !== BRIDGE_CONTROL) break;
              sendBridgeControl('pong', 'heartbeat');
              break;
            case 'fit':
              if (message.channel !== BRIDGE_CONTROL) break;
              reportResize(true);
              break;
            case 'fontSize':
              if (message.channel !== BRIDGE_CONTROL) break;
              var nextFontSize = parseInt(message.payload, 10);
              if (term && !isNaN(nextFontSize) && nextFontSize >= 8 && nextFontSize <= 48) {
                term.options.fontSize = nextFontSize;
                reportResize(true);
              }
              break;
            case 'inputSecurity':
              if (message.channel !== BRIDGE_CONTROL ||
                  (message.payload !== 'plain' && message.payload !== 'masked')) break;
              secureInput = message.payload === 'masked';
              applyInputSecurity();
              break;
            case 'secondaryAction':
              if (message.channel !== BRIDGE_CONTROL) break;
              handleSecondaryAction();
              break;
            case 'copyOrInterrupt':
              if (message.channel !== BRIDGE_CONTROL) break;
              handleCopyOrInterrupt();
              break;
            case 'copySelection':
              if (message.channel !== BRIDGE_CONTROL) break;
              copyTerminalSelection();
              break;
            case 'snapshotRequest':
              if (message.channel !== BRIDGE_CONTROL ||
                  !/^[1-9][0-9]*$/.test(message.payload)) break;
              requestTerminalSnapshot(message.payload);
              break;
            case 'restoreSnapshot':
              if (message.channel !== BRIDGE_CONTROL ||
                  message.payload.length === 0 ||
                  message.payload.length > MAX_SNAPSHOT_PAYLOAD_LENGTH) break;
              if (term) {
                restoringSnapshot = true;
                var completeRestore = function() {
                  restoringSnapshot = false;
                  sendBridgeControl('restoreComplete', '');
                  reportResize(true);
                  reportInteractiveReadyAfterPaint();
                };
                try {
                  term.write(message.payload, completeRestore);
                } catch (ex) {
                  completeRestore();
                }
              }
              break;
            case 'sessionResetViewport':
              if (message.channel !== BRIDGE_CONTROL || message.payload.length !== 0) break;
              if (term) { term.scrollToBottom(); }
              sendBridgeControl('sessionResetComplete', '');
              break;
            case 'sessionOutputAnchor':
              if (message.channel !== BRIDGE_CONTROL || message.payload.length !== 0) break;
              positionSessionOutput(function() {
                sendBridgeControl('sessionOutputAnchorComplete', '');
              });
              break;
            case 'searchOpen':
              if (message.channel !== BRIDGE_CONTROL || message.payload.length !== 0) break;
              openSearch();
              break;
            case 'searchClose':
              if (message.channel !== BRIDGE_CONTROL || message.payload.length !== 0) break;
              closeSearch(true);
              break;
          }
        };

        if (!initialized) {
          initTerminal();
        } else {
          sendBridgeControl('ready', '');
          reportRendererState();
          setTimeout(function() { reportResize(true); }, 100);
        }
      }
    });

    function copyTerminalSelection() {
      if (!term) return false;
      var selection = term.getSelection();
      if (selection.length > 0) {
        sendBridgeControl('copySelection', selection);
        return true;
      }
      return false;
    }

    function handleTerminalCopy(event) {
      if (isSearchOpen()) return;
      if (copyTerminalSelection()) {
        event.preventDefault();
        event.stopPropagation();
      }
    }

    function copySearchInputSelection() {
      var input = searchElement('search-input');
      if (!input || document.activeElement !== input ||
          typeof input.selectionStart !== 'number' || typeof input.selectionEnd !== 'number' ||
          input.selectionEnd <= input.selectionStart) return false;
      sendBridgeControl('copySelection', input.value.substring(input.selectionStart, input.selectionEnd));
      return true;
    }

    function handleCopyOrInterrupt() {
      if (isSearchOpen()) {
        copySearchInputSelection();
        return;
      }
      if (copyTerminalSelection()) return;
      sendBridgeData('terminal', '\x03');
    }

    function applyInputSecurity() {
      if (!term || !term.element || !term.textarea) return;
      term.element.classList.toggle('secure-input', secureInput);
      if (!secureInput) {
        if (secureInputClearTimer) clearTimeout(secureInputClearTimer);
        secureInputClearTimer = 0;
        term.textarea.value = '';
      }
    }

    function scheduleSecureInputClear() {
      if (!secureInput) return;
      if (secureInputClearTimer) clearTimeout(secureInputClearTimer);
      secureInputClearTimer = setTimeout(function() {
        secureInputClearTimer = 0;
        if (secureInput && term && term.textarea) term.textarea.value = '';
      }, 100);
    }

    function handleSecondaryAction() {
      if (!LeanTTYTerminalPolicy.shouldRunTerminalSecondaryAction(isSearchOpen())) return;
      if (copyTerminalSelection()) return;
      pasteFromSystemClipboard();
    }

  </script>
</body>
</html>
