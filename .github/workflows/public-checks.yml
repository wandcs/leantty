name: Public Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-policy:
    name: Source policy and PowerShell syntax
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run public-source checks
        shell: pwsh
        run: ./tools/check-public-source.ps1
      - name: Run build workflow regressions
        shell: pwsh
        run: ./tools/test-build-workflows.ps1

  offline-guide:
    # Stable required-check identity; the Web terminal is removed, leaving its guide.
    name: Web terminal policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check packaged guide and preview
        run: |
          node tools/web-terminal/test-user-guide.mjs
          node tools/web-terminal/test-user-guide-preview.mjs

  rust-core:
    name: Rust formatting, lint and core tests
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.96.1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --manifest-path leantty_ssh/Cargo.toml --all -- --check
      - name: Lint pure core
        run: cargo clippy --locked --manifest-path leantty_ssh/Cargo.toml -p leantty-ssh-core --all-targets -- -D warnings
      - name: Test pure core
        run: cargo test --locked --manifest-path leantty_ssh/Cargo.toml -p leantty-ssh-core
